name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 22: vite and rolldown require ^20.19 || >=22.12, and v5 of the actions
      # drops the Node 20 runtime deprecation warning.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Versions
        run: node -v && npm -v

      # `npm ci` first for a deterministic install, falling back to `npm install`.
      # The lockfile is generated on Windows, and npm does not record the transitive
      # dependencies of optional packages that do not apply to the host platform
      # (here @emnapi/runtime, pulled in by the wasm builds of tailwind/rolldown).
      # That makes `npm ci` fail on Linux through no fault of the lockfile's versions,
      # which are still pinned and still honoured by the fallback.
      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Build
        # Project sites live at /<repo>/, so the asset base has to match the repo
        # name. Deriving it here keeps the build correct whatever the repo is called.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Show build output
        run: ls -R dist | head -30

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
